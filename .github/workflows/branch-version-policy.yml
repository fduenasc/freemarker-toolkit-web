name: Branch version policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

jobs:
  validate-branch-suffix:
    name: Validate branch suffix
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name ends with -MAJOR, -MINOR or -PATCH
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Branch: $BRANCH"

          if [[ ! "$BRANCH" =~ -(MAJOR|MINOR|PATCH)$ ]]; then
            echo "::error::La rama debe terminar en -MAJOR, -MINOR o -PATCH."
            echo "Ejemplos: feature/login-MINOR, fix/bug-42-PATCH, breaking/api-MAJOR"
            exit 1
          fi

          echo "Bump type: ${BASH_REMATCH[1]}"
