name: Branch version policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

jobs:
  validate-branch-suffix:
    name: Validate branch suffix
    runs-on: ubuntu-latest
    steps:
      - name: Check that the branch ends with -MAJOR, -MINOR, or -PATCH
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Branch: $BRANCH"

          if [[ ! "$BRANCH" =~ -(MAJOR|MINOR|PATCH)$ ]]; then
            echo "::error::Branch name must end with -MAJOR, -MINOR, or -PATCH."
            echo "Examples: feature/login-MINOR, fix/bug-42-PATCH, breaking/api-MAJOR"
            exit 1
          fi

          echo "Version bump type: ${BASH_REMATCH[1]}"
