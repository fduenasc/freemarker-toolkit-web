name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve bump type from branch name
        id: bump
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          if [[ ! "$BRANCH" =~ -(MAJOR|MINOR|PATCH)$ ]]; then
            echo "::error::Rama mergeada sin sufijo válido: $BRANCH"
            exit 1
          fi
          echo "type=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: version
        run: |
          BUMP="${{ steps.bump.outputs.type }}"

          LAST_TAG=$(git tag -l --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="0.0.0"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_TAG"

          case "$BUMP" in
            MAJOR) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            MINOR) MINOR=$((MINOR + 1)); PATCH=0 ;;
            PATCH) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "Nueva versión: $NEW_VERSION (desde $LAST_TAG, bump $BUMP)"

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Update pom.xml version
        run: |
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
            -DnewVersion=${{ steps.version.outputs.new_version }} \
            -DgenerateBackupPoms=false

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "chore(release): ${{ steps.version.outputs.new_version }} [skip ci]"
          git push origin main

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          git tag "$NEW_VERSION"
          git push origin "$NEW_VERSION"

          if [ "$PREVIOUS_TAG" = "0.0.0" ]; then
            gh release create "$NEW_VERSION" \
              --title "$NEW_VERSION" \
              --generate-notes
          else
            gh release create "$NEW_VERSION" \
              --title "$NEW_VERSION" \
              --generate-notes \
              --notes-start-tag "$PREVIOUS_TAG"
          fi
